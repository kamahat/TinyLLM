# SearXNG prive pour Jarvis : ecoute UNIQUEMENT sur 127.0.0.1:8888 de la VM (le proxy compact tourne en reseau hote).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
